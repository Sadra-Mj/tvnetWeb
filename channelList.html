<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TVNet Channel Explorer</title>
  <link rel="stylesheet" href="channel-style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Koulen&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="channel-header">
      <a href="index.html" class="back-to-home">← Back to Home</a>
      <h1>TVNet Channel Explorer</h1>
      <div class="search-container">
        <input type="text" placeholder="Search countries..." />
      </div>
  </header>

  <div class="main-container">
    <aside class="category-sidebar">
      <h2>Countries</h2>
      <div class="categories">
        <!-- Country buttons will be injected here by JS -->
      </div>
    </aside>
    <main class="channel-content">
      <div class="channel-list">
        <p class="loading-message">Select a country to see its channels.</p>
        <!-- Channel grid will be injected here by JS -->
      </div>
    </main>
  </div>

  <a href="https://t.me/tvnetus" target="_blank" class="telegram-fab">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.62 11.95c-.5-.16-.52-.5.1-.75l16.35-6.39c.43-.17.83.12.7.52l-2.72 12.79c-.19.85-.73 1.05-1.5.64l-4.27-3.15-2.07 1.99c-.21.21-.39.39-.7.39z"/>
      </svg>
  </a>

  <script src="channel-script.js"></script>
</body>
</html>
